<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:450px;
    height:700px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    display:flex;
    flex-direction:column;
}

.header{
    background:#2563eb;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:80%;
    padding:12px;
    border-radius:12px;
    word-wrap:break-word;
}

.user{
    align-self:flex-end;
    background:#2563eb;
    color:white;
}

.ai{
    align-self:flex-start;
    background:#e5e7eb;
    color:black;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.loading{
    color:gray;
    font-style:italic;
}
</style>
</head>
<body>

<div class="chat-container">

    <div class="header">
        AI Chat
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

const API_BASE = "http://127.0.0.1:8000";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");

function addMessage(text, type){

    const div = document.createElement("div");
    div.classList.add("message", type);
    div.innerText = text;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;

    return div;
}

async function loadChats(){

    try{

        const response = await fetch(
            `${API_BASE}/api/chat/retrive`
        );

        const chats = await response.json();

        chatBox.innerHTML = "";

        chats.forEach(chat => {

            addMessage(chat.usermessage, "user");
            addMessage(chat.aimessage, "ai");

        });

    }
    catch(error){

        console.error(error);

        addMessage(
            "Could not load previous chats",
            "ai"
        );

    }

}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    const loading = addMessage("Thinking...", "ai");

    try {

        const response = await fetch(
            `${API_BASE}/api/chat/send`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: 1,
                    message: message
                })
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        loading.remove();

        addMessage(data.message, "ai");

    }
    catch (error) {

        loading.remove();

        addMessage(
            "Failed to contact server.",
            "ai"
        );

        console.error(error);
    }
}

input.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage();
    }

});

loadChats();

</script>

</body>
</html>
